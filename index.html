<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowAndStyleCases</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #d63384;
        }
        .product-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            background: #fff;
        }
        .product-card img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }
        .btn {
            display: inline-block;
            background-color: #0088cc;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #006699;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>GlowAndStyleCases ✨</h1>
        <p>Exclusive & Aesthetic Phone Cases. Order directly via Telegram!</p>

        <!-- Product 1 -->
        <div class="product-card">
            <h3>Minimalist Floral Phone Case</h3>
            <p>High-quality print, sleek and durable protection.</p>
            <!-- یہاں اپنی پروڈکٹ کی تصویر کا نام لکھیں -->
            <img src="IMG_20260721_201153.jpg" alt="Phone Case">
            <br>
            <!-- یہاں اپنے ٹیلیگرام کا لنک یا یوزر نیم ڈال دیں -->
            <a href="https://t.me/YourTelegramUsername" class="btn" target="_blank">Order on Telegram</a>
        </div>

    </div>

</body>
</html>
